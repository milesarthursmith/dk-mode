services:
  default:
    image: dk-hooked
    build: .
    command: "tail -f /dev/null"
    init: true
    # Three things must be true for the dk arm to be a real dk arm, and
    # all three failed silently on the first flights - the hooks fired,
    # the static note was injected, and the model-based monitor never ran,
    # so the arm was quietly "deterministic hooks only". An audit of seven
    # runs counted 212 static notes, 13 tripwire warnings and zero live
    # monitor blocks. Check for live blocks before believing a dk result.
    #
    # 1. CREDENTIALS. The DK_* variables have to reach the hook processes.
    #    Without a key dk_watch takes its no-key exit.
    # 2. TLS TRUST. dk_watch calls a model from INSIDE the container; the
    #    other two hooks need no network, so a failure here is invisible in
    #    the transcript and just looks like a quiet monitor. Where egress
    #    is re-terminated by a policy proxy, the container reaches the host
    #    but cannot verify the chain (curl exit 60). Point DK_CA_BUNDLE at
    #    that proxy's CA file. On a direct-internet host, leave it unset.
    #    Do NOT reach for network_mode: host - inspect_swe gives each
    #    container its own model proxy, and sharing the host namespace
    #    makes them collide on one port (Errno 98).
    # 3. A MULTI-TURN SESSION, which is set in arms_hooked.py, not here.
    volumes:
      - ${DK_CA_BUNDLE:-/etc/hostname}:/opt/dk-ca.crt:ro
    environment:
      DK_API_KEY: ${DK_API_KEY:-}
      DK_BACKEND: ${DK_BACKEND:-}
      DK_API_URL: ${DK_API_URL:-}
      DK_WATCH_MODELS: ${DK_WATCH_MODELS:-}
      SSL_CERT_FILE: ${DK_SANDBOX_CA:-}
      CURL_CA_BUNDLE: ${DK_SANDBOX_CA:-}
      REQUESTS_CA_BUNDLE: ${DK_SANDBOX_CA:-}
    stop_grace_period: 1s
    mem_limit: 2gb
